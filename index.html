<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Odin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="hero">
      <div class="logo-box">
        <img src="imgs/odin-lined.png" alt="" class="logo-img">
        <span class="logo-text">Odin</span>
      </div>
      <p class="credit">
        Photo by <a href="https://unsplash.com/photos/25xggax4bSA">the photographer</a> on Unsplash
      </p>
    </section>

    <section class="signup">
      <div class="signup-intro">
        <h1>Let's get you set up</h1>
        <p>It should only take a couple of minutes to pop in your details.</p>
      </div>

      <form action="#" method="post">
        <fieldset>
          <legend>Your details</legend>

          <div class="field">
            <label for="first-name">First name</label>
            <input type="text" id="first-name" name="first_name" autocomplete="given-name" required>
          </div>

          <div class="field">
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" name="last_name" autocomplete="family-name" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel"
                   pattern="[0-9+()\- ]{7,20}" title="Use 7 to 20 digits, spaces, +, - or brackets">
          </div>
        </fieldset>

        <fieldset>
          <legend>Choose a password</legend>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password"
                   minlength="8" required
                   pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                   title="At least 8 characters, with at least one letter and one number">
          </div>

          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password"
                   minlength="8" required
                   pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                   title="At least 8 characters, with at least one letter and one number">
          </div>
        </fieldset>

        <button type="submit">Create account</button>

        <p class="login-link">Already have an account? <a href="#">Log in</a></p>
      </form>
    </section>
  </main>
</body>
</html>
